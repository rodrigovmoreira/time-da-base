services:
  time-da-base-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: time-da-base-frontend:latest
    container_name: time-da-base-frontend
    restart: unless-stopped
    ports:
      - "5180:80" # Porta 5180 do servidor -> 80 do Nginx
    networks:
      - squamata-global
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  squamata-global:
    external: true
